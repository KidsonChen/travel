<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行記帳 · 費用分攤</title>
<style>
  :root{
    --primary:#EA580C; --primary-ink:#FFFFFF;
    --secondary:#0891B2; --secondary-ink:#FFFFFF;
    --accent:#D97706;
    --bg:#FFF7ED; --surface:#FFFFFF; --ink:#0F172A; --muted:#64748B;
    --line:#FCEAE1; --line-strong:#F6D9C4;
    --ok:#047857; --ok-bg:#ECFDF5; --ok-line:#6EE7B7;
    --warn:#B45309; --warn-bg:#FFFBEB; --warn-line:#FCD34D;
    --danger:#DC2626;
    --radius:18px; --radius-sm:12px;
    --shadow:0 6px 24px rgba(15,23,42,.08);
    --shadow-lg:0 12px 44px rgba(15,23,42,.22);
    --font:"Atkinson Hyperlegible","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);
    background:#e8eef2;-webkit-font-smoothing:antialiased;line-height:1.6}
  #app{display:flex;flex-direction:column;min-height:100vh}

  /* Header */
  header{background:linear-gradient(120deg,var(--primary),var(--accent));
    color:#fff;padding:16px 20px;flex:0 0 auto;box-shadow:0 4px 16px rgba(234,88,12,.25)}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:12px}
  header h1 svg{width:26px;height:26px;flex:0 0 auto}
  header p{margin:6px 0 0;font-size:13px;opacity:.95;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  header p svg{width:15px;height:15px;opacity:.9}

  /* Main Layout */
  #main{padding:24px 16px 48px;flex:1}
  .container{max-width:1200px;margin:0 auto}
  .stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
    text-align:center;border:1px solid var(--line)}
  .stat-card h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
  .stat-card .value{font-size:32px;font-weight:700;color:var(--primary);line-height:1}
  .stat-card .value.small{font-size:22px}

  /* Tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px;padding:16px;background:#FFF3EA;border-radius:var(--radius-sm)}
  .tab{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line-strong);
    color:var(--ink);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;
    transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
  .tab:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
  .tab.active{background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff;border-color:transparent;
    box-shadow:0 4px 12px rgba(234,88,12,.35)}
  .tab .cnt{font-size:11px;font-weight:800;background:rgba(234,88,12,.12);color:var(--primary);
    border-radius:999px;padding:2px 9px}
  .tab.active .cnt{background:rgba(255,255,255,.28);color:#fff}

  /* Sections */
  .section{display:none}
  .section.active{display:block}
  .section h2{margin:0 0 16px;font-size:18px;color:var(--primary);font-weight:700;display:flex;align-items:center;gap:8px}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
    margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px;
    border-bottom:1.5px solid var(--line);padding-bottom:8px}
  .card h3 svg{width:18px;height:18px;color:var(--primary)}

  /* Form Elements */
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:12px}
  .form-group{display:flex;flex-direction:column}
  .form-group label{font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
  input,select{padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:10px;font-size:13px;
    font-family:inherit;background:#FFFBF7;transition:border-color .15s ease,box-shadow .15s ease}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(234,88,12,.18)}
  input.type-amount{font-size:16px;font-weight:600;color:var(--primary);text-align:right}
  input.type-person{flex:1}

  /* Buttons */
  .btn-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  button{font-family:inherit;font-size:13px;border:none;border-radius:10px;padding:9px 14px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
  .btn-primary{background:var(--primary);color:var(--primary-ink);font-weight:600;box-shadow:var(--shadow)}
  .btn-primary:hover{background:#C2410C;transform:translateY(-1px)}
  .btn-secondary{background:#F0F9FF;color:var(--secondary);font-weight:600}
  .btn-secondary:hover{background:#E0F2FE;transform:translateY(-1px)}
  .btn-danger{background:#FEE2E2;color:var(--danger);font-weight:600}
  .btn-danger:hover{background:#FECACA}
  .btn-sm{padding:6px 11px;font-size:11.5px}

  /* Lists */
  .item-list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;background:#FFFBF7;border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;transition:background .15s ease}
  .item:hover{background:#FFF1E6}
  .item-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:700;color:#fff}
  .item-info{flex:1}
  .item-name{font-size:14.5px;font-weight:600;color:var(--ink)}
  .item-desc{font-size:12px;color:var(--muted)}
  .item-amount{font-size:16px;font-weight:700;color:var(--primary);min-width:70px;text-align:right}
  .item-actions{display:flex;gap:6px}
  .item-actions button{padding:4px 8px}

  /* Result Cards */
  .result-card{background:linear-gradient(120deg,#F97316,#FB923C);color:#fff;border-radius:14px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .result-card h3{margin:0 0 8px;font-size:14px;opacity:.95;border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:6px}
  .result-card .person-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,.25)}
  .result-card .person-row:last-child{border-bottom:none}
  .person-name{font-size:14.5px;font-weight:600}
  .person-amount{font-size:18px;font-weight:700}

  .settle-card{background:#FFF; border:2px solid var(--primary);border-radius:14px;padding:16px;margin-top:16px}
  .settle-card h3{color:var(--primary);margin:0 0 12px;border-bottom:2px solid var(--primary);padding-bottom:6px}
  .settle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    background:#FFFBF7;border-radius:8px;padding:10px 12px}
  .settle-row .from{font-size:14px;color:var(--danger);font-weight:600}
  .settle-row .arrow{color:var(--primary);font-size:18px}
  .settle-row .to{font-size:14px;color:var(--secondary);font-weight:600}
  .settle-row .amount{font-size:16px;font-weight:700;color:var(--primary)}

  /* Empty States */
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}

  /* Responsive */
  @media(max-width:768px){
    .form-row{grid-template-columns:1fr}
    .stats-bar{grid-template-columns:repeat(2,1fr)}
    .stat-card .value{font-size:26px}
  }
  @media(max-width:480px){.stats-bar{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="margin-bottom:10px">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        返回首頁
      </a>
    </div>
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      🧾 旅行記帳 · 費用分攤
    </h1>
    <p>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      共計 4 人 · 記錄所有開支 · 自動計算分攤
    </p>
  </header>

  <div id="main">
    <div class="container">
      <!-- 總覽統計 -->
      <div class="stats-bar">
        <div class="stat-card">
          <h3>📊 總支出</h3>
          <div class="value" id="totalExpenses">NT$ 0</div>
        </div>
        <div class="stat-card">
          <h3>👥 人均支出</h3>
          <div class="value" id="perPerson">NT$ 0</div>
        </div>
        <div class="stat-card">
          <h3>💰 應付總額</h3>
          <div class="value" id="totalSettle">NT$ 0</div>
        </div>
        <div class="stat-card">
          <h3>📝 記錄數</h3>
          <div class="value small" id="recordCount">0</div>
        </div>
      </div>

      <!-- 分頁導航 -->
      <div class="tabs">
        <button class="tab active" data-tab="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>新增開支</span><span class="cnt" id="tabCountAdd">0</span></button>
        <button class="tab" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>支出清單</span><span class="cnt" id="tabCountList">0</span></button>
        <button class="tab" data-tab="result"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>結算明細</span><span class="cnt" id="tabCountResult">0</span></button>
      </div>

      <!-- 新增開支 -->
      <div id="tab-add" class="section active">
        <div class="card">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4h4M11 8h6M11 12h6M11 16h4M4 4h2M4 8h2M4 12h2M4 16h2"/></svg> 新增一筆開支</h3>
          <div class="form-row">
            <div class="form-group">
              <label>項目名稱</label>
              <input type="text" id="expenseName" placeholder="例如：餐廳、景點門票">
            </div>
            <div class="form-group">
              <label>金額</label>
              <input type="number" id="expenseAmount" class="type-amount" placeholder="0" min="0">
            </div>
            <div class="form-group">
              <label>付款人</label>
              <select id="expensePayer">
                <option value="佑任">佑任</option>
                <option value="煌其">煌其</option>
                <option value="芯慬">芯慬</option>
                <option value="嘉蕙">嘉蕙</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="grid-column:1/-1">
              <label>共同使用者</label>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <label style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:#F0F9FF;border:1.5px solid #BAE6FD;cursor:pointer">
                  <input type="checkbox" class="share-person" value="佑任" checked> 佑任
                </label>
                <label style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:#F0F9FF;border:1.5px solid #BAE6FD;cursor:pointer">
                  <input type="checkbox" class="share-person" value="煌其" checked> 煌其
                </label>
                <label style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:#F0F9FF;border:1.5px solid #BAE6FD;cursor:pointer">
                  <input type="checkbox" class="share-person" value="芯慬" checked> 芯慬
                </label>
                <label style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:#F0F9FF;border:1.5px solid #BAE6FD;cursor:pointer">
                  <input type="checkbox" class="share-person" value="嘉蕙" checked> 嘉蕙
                </label>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="grid-column:1/-1">
              <label>備註（可選）</label>
              <input type="text" id="expenseNote" placeholder="例如：晚餐、景點門票...">
            </div>
          </div>
          <div class="btn-group">
            <button class="btn-primary" onclick="addExpense()">＋ 新增開支</button>
            <button class="btn-secondary" onclick="resetForm()">重置表單</button>
            <button class="btn-secondary" onclick="exportData()">📦 匯出 JSON</button>
            <button class="btn-secondary" onclick="importData()">📁 匯入 JSON</button>
          </div>
        </div>
      </div>

      <!-- 支出清單 -->
      <div id="tab-list" class="section">
        <div class="card">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2 0l8 6Z"/><path d="m22 8-10-7 10-7v14Z"/></svg> 所有支出記錄</h3>
          <div class="item-list" id="expenseList">
            <div class="empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              <p>尚未新增任何開支</p>
              <p style="font-size:12px;margin-top:6px">點擊「新增開支」開始記帳</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 結算明細 -->
      <div id="tab-result" class="section">
        <div class="card">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 費用分攤計算</h3>
          <div class="settle-card">
            <h3>💰 誰應該給誰多少錢？</h3>
            <div id="settleList">
              <div class="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <p>尚無足夠數據計算分攤</p>
                <p style="font-size:12px;margin-top:6px">請先新增一些開支記錄</p>
              </div>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 個人結算明細</h3>
          <div id="personalSettlements">
            <div class="empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <p>尚無分攤結果</p>
              <p style="font-size:12px;margin-top:6px">新增開支後將自動計算</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 人員列表
  const persons = ["佑任", "煌其", "芯慬", "嘉蕙"];
  let expenses = [];

  // 初始化
  document.addEventListener('DOMContentLoaded', function() {
    // 载入本地儲存
    loadFromStorage();
    
    // Tab 切換
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        this.classList.add('active');
        const tabId = this.dataset.tab;
        document.getElementById('tab-' + tabId).classList.add('active');
      });
    });

    // 默認切換到結算標籤
    document.querySelector('.tab[data-tab="result"]').click();

    // 更新畫面
    updateUI();
  });

  // 新增開支
  function addExpense() {
    const name = document.getElementById('expenseName').value.trim();
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    const payer = document.getElementById('expensePayer').value;
    const note = document.getElementById('expenseNote').value.trim();
    
    const sharedPersons = Array.from(document.querySelectorAll('.share-person:checked')).map(cb => cb.value);
    
    if (!name || isNaN(amount) || amount <= 0) {
      alert('請輸入項目名稱和正確的金額');
      return;
    }
    
    if (sharedPersons.length === 0) {
      alert('請選擇至少一位共同使用者');
      return;
    }
    
    const expense = {
      id: Date.now(),
      name,
      amount,
      payer,
      note,
      shared: sharedPersons,
      date: new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit'})
    };
    
    expenses.push(expense);
    saveToStorage();
    resetForm();
    updateUI();
  }

  // 重置表單
  function resetForm() {
    document.getElementById('expenseName').value = '';
    document.getElementById('expenseAmount').value = '';
    document.getElementById('expenseNote').value = '';
    document.querySelectorAll('.share-person').forEach(cb => cb.checked = true);
  }

  // 刪除開支
  function deleteExpense(id) {
    if (confirm('確定要刪除此筆開支？')) {
      expenses = expenses.filter(e => e.id !== id);
      saveToStorage();
      updateUI();
    }
  }

  // 計算結算
  function calculateSettlement() {
    const settlement = {};
    const total = expenses.reduce((sum, e) => sum + e.amount, 0);
    const perPerson = total / persons.length;
    
    // 初始化每人帳戶
    persons.forEach(p => {
      settlement[p] = { paid: 0, share: 0, difference: 0 };
    });
    
    // 計算每人實際支付和應該支付
    expenses.forEach(e => {
      settlement[e.payer].paid += e.amount;
      const sharePerPerson = e.amount / e.shared.length;
      e.shared.forEach(person => {
        settlement[person].share += sharePerPerson;
      });
    });
    
    // 計算差額
    persons.forEach(p => {
      settlement[p].difference = settlement[p].paid - settlement[p].share;
    });
    
    // 計算實際需要轉帳的金額（使用最小轉帳次數演算法）
    const debts = [];
    const credits = [];
    
    persons.forEach(p => {
      if (settlement[p].difference < -0.01) {
        debts.push({ person: p, amount: -settlement[p].difference });
      } else if (settlement[p].difference > 0.01) {
        credits.push({ person: p, amount: settlement[p].difference });
      }
    });
    
    // 排序：欠錢多的優先，收款多的優先
    debts.sort((a, b) => b.amount - a.amount);
    credits.sort((a, b) => b.amount - a.amount);
    
    const transactions = [];
    let debtIdx = 0;
    let creditIdx = 0;
    
    while (debtIdx < debts.length && creditIdx < credits.length) {
      const minAmount = Math.min(debts[debtIdx].amount, credits[creditIdx].amount);
      
      transactions.push({
        from: debts[debtIdx].person,
        to: credits[creditIdx].person,
        amount: minAmount
      });
      
      debts[debtIdx].amount -= minAmount;
      credits[creditIdx].amount -= minAmount;
      
      if (debts[debtIdx].amount < 0.01) debtIdx++;
      if (credits[creditIdx].amount < 0.01) creditIdx++;
    }
    
    return { total, perPerson, settlement, transactions };
  }

  // 更新 UI
  function updateUI() {
    // 更新統計
    const total = expenses.reduce((sum, e) => sum + e.amount, 0);
    const perPerson = expenses.length > 0 ? total / persons.length : 0;
    const { settlement, transactions } = calculateSettlement();
    
    document.getElementById('totalExpenses').textContent = 'NT$ ' + total.toLocaleString();
    document.getElementById('perPerson').textContent = 'NT$ ' + perPerson.toLocaleString();
    document.getElementById('totalSettle').textContent = 'NT$ ' + total.toLocaleString();
    document.getElementById('recordCount').textContent = expenses.length;
    
    // 更新 Tab 計數
    document.getElementById('tabCountAdd').textContent = expenses.length;
    document.getElementById('tabCountList').textContent = expenses.length;
    
    // 更新支出清單
    const expenseList = document.getElementById('expenseList');
    if (expenses.length === 0) {
      expenseList.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <p>尚未新增任何開支</p>
          <p style="font-size:12px;margin-top:6px">點擊「新增開支」開始記帳</p>
        </div>
      `;
    } else {
      expenseList.innerHTML = expenses.map((e, idx) => {
        const payerAvatar = getAvatar(e.payer);
        const sharedCount = e.shared.length;
        return `
          <div class="item">
            <div class="item-avatar" style="background:linear-gradient(135deg,#F97316,#FB923C)">${payerAvatar}</div>
            <div class="item-info">
              <div class="item-name">${e.name}</div>
              <div class="item-desc">${e.date}｜${e.payer}支付｜${sharedCount}人分攤${e.note ? '｜' + e.note : ''}</div>
            </div>
            <div class="item-amount">NT$ ${e.amount.toLocaleString()}</div>
            <div class="item-actions">
              <button class="btn-danger btn-sm" onclick="deleteExpense(${e.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // 更新結算明細
    const settleList = document.getElementById('settleList');
    if (expenses.length === 0) {
      settleList.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <p>尚無足夠數據計算分攤</p>
          <p style="font-size:12px;margin-top:6px">請先新增一些開支記錄</p>
        </div>
      `;
    } else {
      let html = '';
      transactions.forEach(t => {
        html += `
          <div class="settle-row">
            <span class="from">${t.from} ➝</span>
            <span class="arrow">➤</span>
            <span class="to">${t.to}</span>
            <span class="amount">NT$ ${Math.round(t.amount).toLocaleString()}</span>
          </div>
        `;
      });
      if (transactions.length === 0) {
        html = `
          <div class="empty" style="padding:24px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <p>費用已完全平衡！</p>
            <p style="font-size:12px;margin-top:6px">每人實際支出與應付金額相符，無需轉帳</p>
          </div>
        `;
      }
      settleList.innerHTML = html;
    }
    
    // 更新個人結算明細
    const personalSettlements = document.getElementById('personalSettlements');
    let personalHtml = '';
    persons.forEach(p => {
      const s = settlement[p];
      const color = s.difference > 0 ? '#047857' : (s.difference < 0 ? '#DC2626' : '#64748B');
      const icon = s.difference > 0 ? '💰' : (s.difference < 0 ? '📉' : '⚖️');
      const diffText = s.difference > 0 ? '應收款' : (s.difference < 0 ? '應付款' : '已平衡');
      const diffVal = Math.abs(s.difference);
      
      personalHtml += `
        <div class="result-card">
          <h3>${p} - ${icon}</h3>
          <div class="person-row">
            <span>實際支付</span>
            <span>NT$ ${s.paid.toLocaleString()}</span>
          </div>
          <div class="person-row">
            <span>應付金額</span>
            <span>NT$ ${s.share.toLocaleString()}</span>
          </div>
          <div class="person-row" style="font-weight:700;color:${color}">
            <span>${diffText}</span>
            <span>NT$ ${diffVal.toLocaleString()}</span>
          </div>
        </div>
      `;
    });
    personalSettlements.innerHTML = personalHtml;
  }

  // 獲取頭像縮寫
  function getAvatar(name) {
    return name.substring(0, 1);
  }

  // 本地儲存
  function saveToStorage() {
    localStorage.setItem('splitbill_expenses', JSON.stringify(expenses));
  }
  
  function loadFromStorage() {
    const saved = localStorage.getItem('splitbill_expenses');
    if (saved) {
      expenses = JSON.parse(saved);
    }
  }

  // 匯出 JSON
  function exportData() {
    const data = JSON.stringify(expenses, null, 2);
    const blob = new Blob([data], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '旅行記帳_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
  }

  // 匯入 JSON
  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if (Array.isArray(data)) {
            expenses = data;
            saveToStorage();
            updateUI();
            alert('成功匯入 ' + expenses.length + ' 筆開支記錄');
          } else {
            alert('檔案格式錯誤：應為 JSON 陣列');
          }
        } catch (err) {
          alert('無法解析 JSON 檔案');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }
</script>
</body>
</html>
